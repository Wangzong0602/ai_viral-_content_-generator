[project]
name = "ai-passage-creator-backend"
version = "0.0.1"
description = "AI 爆款文章创作器 - Python 后端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography==43.0.3",
    "databases[mysql]==0.9.0",
    "redis==5.2.0",
    "aioredis==2.0.1",
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "bcrypt==4.2.1",
    "PyJWT==2.10.1",
    "email-validator==2.2.0",
    "python-dateutil==2.9.0.post0",
    "openai==2.32.0",
    "langgraph==1.1.8",
    "langgraph-checkpoint-redis==0.5.1",
    "celery==5.6.3",
    "beautifulsoup4==4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["app"]
